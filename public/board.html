<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promptocracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Martian+Mono:wdth,wght@87.5..112.5,400..700&family=Grenze+Gotisch:wght@100..900&display=swap">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="gamehead">
  <div class="title"><a href="/">&#9666; promptocracy.us</a><h1 id="title">Promptocracy</h1></div>
  <div class="right" id="who"></div>
  <div class="notif" id="notes-panel" hidden>
    <h3>Notifications</h3>
    <ul class="notes" id="notes"></ul>
  </div>
</header>
<div class="banner" id="notice" hidden></div>
<div class="loginbar" id="login-panel" hidden>
  <form class="stack" id="login-form">
    <label class="field"><span>Email you joined with</span><input type="email" name="email" required autocomplete="email"></label>
    <button class="btn" type="submit">Email me a log-in link</button>
    <div id="login-msg" role="status"></div>
  </form>
</div>

<div class="playtop">
  <div class="boardcol">
    <div class="board-wrap" id="board-wrap"><noscript>The board needs JavaScript. The tiles are listed below.</noscript></div>
    <div class="dock" id="dock" aria-live="polite"></div>
  </div>
  <aside class="side" aria-label="Players">
    <h3 class="sideh">Players</h3>
    <ul class="players" id="scores"></ul>
  </aside>
</div>
<h2 class="sr-only">Tiles</h2>
<ul class="sr-only" id="tile-list"></ul>

<section class="rbwrap" id="rules" aria-label="Rulebook">Loading&hellip;</section>

<section class="log-sec">
  <h2>What happened</h2>
  <ul class="log" id="log"></ul>
</section>

<script type="module">
  // One page for every game. The slug is the first path segment; every call goes to /<slug>/api/...
  // The board is drawn from /api/board, the players and the log from /api/game, the rulebook from /api/rules
  // (the game's own repo, fetched by the server). /api/me and /api/notifications say who is looking.
  import { ensureDefs, pieceSVG } from "/js/pieces.js";
  import { mountRulebook } from "/js/rulebook.js";
  const SLUG = location.pathname.split("/")[1] || "";
  const BASE = "/" + SLUG;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
  const $ = id => document.getElementById(id);
  const NOTICES = {
    "joined": "You're in. Your seat is yours.",
    "welcome-back": "You're logged in.",
    "link-invalid": "That link has expired or was already used. Log in again to get a new one.",
    "no-room": "Couldn't finish joining: there is no room on the map yet for a new piece to start.",
    "join-failed": "Couldn't finish joining: that piece color was taken, the game is full, or it has started. Open the join link again to pick another color."
  };
  const api = async (path, body) => {
    const res = await fetch(BASE + path, body === undefined ? { cache: "no-store" } : {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    let data = null; try { data = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, data };
  };
  let ME = null, DATA = null;   // who is looking, and the last /api/game
  let BOARD = null, SEL = null, VIEW = null;   // the last /api/board, the selected tile {x,y}, the drawn board
  const hex = c => (c && /^#[0-9a-f]{6}$/i.test(c.hex) ? c.hex : "#888");
  const who = (name, c) => `${name} (${c ? c.name : "?"})`;
  const when = iso => String(iso || "").slice(0, 10);
  ensureDefs();
  const mini = p => `<svg viewBox="-22 -46 44 50" aria-hidden="true">${pieceSVG({ shape: p.shape, color: p.color, scale: 1, clip: false })}</svg>`;

  function showNotice() {
    const n = new URLSearchParams(location.search).get("notice");
    if (n && NOTICES[n]) { $("notice").textContent = NOTICES[n]; $("notice").hidden = false; }
    if (n) history.replaceState(null, "", BASE + "/");
  }

  async function loadMe() {
    const me = await api("/api/me");
    const who_ = $("who");
    ME = me.ok ? me.data : null;
    drawDock();
    if (VIEW && ME && ME.player) VIEW.setMe(ME.player.color.key);
    if (!me.ok) {
      who_.innerHTML = '<button class="btn ghost small" id="login-btn" type="button">Log in</button>';
      $("login-btn").onclick = () => { $("login-panel").hidden = !$("login-panel").hidden; };
      return;
    }
    const p = me.data.player;
    who_.innerHTML = `<button class="iconbtn" id="bell" type="button" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z M10 21h4" style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round"/></svg><span class="badge" id="badge" hidden>0</span></button>
      <span class="me">${p ? `<span class="dot" style="background:${hex(p.color)}"></span>` : ""}<span class="nm">${esc(me.data.user.name)}</span></span>
      <button class="btn ghost small" id="logout" type="button">Log out</button>`;
    $("logout").onclick = async () => { await api("/api/logout", {}); location.reload(); };
    $("bell").onclick = toggleNotes;
    await loadNotes(false);
  }

  async function loadNotes(open) {
    const r = await api("/api/notifications");
    if (!r.ok) return;
    const list = r.data.notifications, unread = r.data.unread;
    $("badge").textContent = unread; $("badge").hidden = !unread;
    $("notes").innerHTML = list.length ? list.map(n => `<li class="${n.read_at ? "" : "unread"}">${esc(n.body)}
      <small>${esc(when(n.created_at))}</small></li>`).join("") : "<li>Nothing yet.</li>";
    if (open && unread) { await api("/api/notifications/read", { all: true }); $("badge").hidden = true; }
  }
  async function toggleNotes() {
    const panel = $("notes-panel");
    panel.hidden = !panel.hidden;
    if (!panel.hidden) await loadNotes(true);
  }

  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("login-msg");
    msg.textContent = "Sending…";
    const r = await api("/api/login", { email: new FormData(e.target).get("email") });
    msg.className = r.ok ? "notice" : "notice err";
    msg.textContent = (r.data && (r.data.message || r.data.error)) || "Something went wrong.";
    if (r.ok && r.data.dev_link) {
      const p = document.createElement("p"); p.className = "dev"; p.append("Dev mode link: ");
      const a = document.createElement("a"); a.href = r.data.dev_link; a.textContent = r.data.dev_link;
      p.append(a); msg.append(p);
    }
  });

  async function load() {
    showNotice();
    loadMe();
    const g = await api("/api/game");
    if (!g.ok) $("dock").innerHTML = '<span class="err">No game has been set up yet.</span>';
    else drawGame(g.data);
    // the rulebook shows each rule's settings, so it waits for the board's reply (which carries them)
    const [rules] = await Promise.all([fetch(BASE + "/api/rules").then(async r => { if (!r.ok) throw new Error("rules " + r.status); return r.text(); }).catch(() => null), boardLoaded]);
    if (rules === null) { $("rules").innerHTML = '<p class="err" style="padding:20px 28px">Rules unavailable right now. They live in the game\'s repo.</p>'; return; }
    mountRulebook($("rules"), rules, { settings: (BOARD && BOARD.settings) || {} });
    const repo = DATA && DATA.game && DATA.game.repo;
    const head = $("rules").querySelector(".rbhead");
    if (head && /^[\w.-]+\/[\w.-]+$/.test(repo || "")) head.insertAdjacentHTML("beforeend", `<a class="mono" href="https://github.com/${esc(repo)}">github.com/${esc(repo)}</a>`);
  }

  // The dock under the board: where the game stands, the selected tile, and (on your turn) the turn form.
  function drawDock() {
    const box = $("dock");
    if (!DATA) return;
    const { game, players, turns } = DATA;
    const target = Number(game.winning_score) || 100;
    const current = game.status === "setup" ? null : (players[game.turn] || null);
    const mine = ME && ME.player && current && ME.player.turn_order === game.turn;
    const taken = current ? turns.find(t => t.turn_index === game.turn) : null;
    const moved = !!game.moved;
    document.title = game.name || "Promptocracy";
    $("title").textContent = game.name || "Promptocracy";
    let html = game.status === "setup"
      ? `<p><strong>Setting up.</strong> ${players.length} of ${game.max_players} seats taken. First to ${target} points wins (for now).</p>`
      : `<p><strong>Round ${game.round}.</strong> ${current ? esc(who(current.name, current.color)) + "'s turn." : ""} First to ${target} points wins (for now).</p>`;
    const moveLine = moved ? "You have moved this turn." : "You may also move your piece one space: tap a tile next to it, then Move here.";
    if (game.status === "playing" && current) {
      if (mine && !taken) {
        html += `<form id="turn-form"><p><strong>Your turn.</strong> You may propose one rule change: write one prompt for Chalant (the moderator). ${moveLine}</p>
          <textarea name="prompt" rows="4" maxlength="2000" required aria-label="Your prompt"></textarea>
          <div><button class="btn" type="submit">Submit my turn</button></div>
          <div id="turn-msg" role="status"></div></form>`;
      } else if (mine) {
        html += `<p><strong>Your turn.</strong> Your prompt is in: waiting for Chalant (the moderator). ${moveLine}</p><blockquote>${esc(taken.prompt)}</blockquote>`;
      } else if (taken) {
        html += `<p><strong>${esc(who(current.name, current.color))}</strong> took their turn. Waiting for Chalant (the moderator).</p><blockquote>${esc(taken.prompt)}</blockquote>`;
      }
    }
    // an unsent prompt survives a redraw (a move refreshes the page's state while the player is still writing)
    const old = box.querySelector("textarea[name=prompt]"), draft = old ? old.value : "";
    box.innerHTML = html + '<div id="tile-panel"></div>';
    const ta = box.querySelector("textarea[name=prompt]");
    if (ta && draft) ta.value = draft;
    drawPanel();
    const form = $("turn-form");
    if (form) form.addEventListener("submit", async e => {
      e.preventDefault();
      const msg = $("turn-msg");
      msg.textContent = "Sending…";
      const r = await api("/api/turn", { prompt: new FormData(form).get("prompt") });
      if (r.ok) { await refresh(); loadNotes(false); return; }
      msg.className = "notice err";
      msg.textContent = (r.data && r.data.error) || "Something went wrong.";
      if (r.status === 409 || r.status === 403) { const g = await api("/api/game"); if (g.ok) { const t = msg.textContent; drawGame(g.data); const m = $("turn-msg"); if (m) { m.className = "notice err"; m.textContent = t; } } }
    });
  }

  function drawGame(data) {
    DATA = data;
    const game = data.game, players = data.players || [];
    const current = game.status === "setup" ? null : (players[game.turn] || null);
    // Scoreboard, highest first; ties keep turn order.
    const ranked = players.map((p, i) => ({ ...p, i })).sort((a, b) => (b.score - a.score) || (a.i - b.i));
    $("scores").innerHTML = ranked.map(p => {
      const now = current && p.color.key === current.color.key;
      return `<li class="${now ? "now" : ""}">${mini(p)}<span>${esc(p.name)}${ME && ME.player && ME.player.color.key === p.color.key ? " (you)" : ""}<span class="st">${esc(p.color.name)}${now ? " · to play" : ""}</span></span><b>${esc(p.score)}</b></li>`;
    }).join("");
    // The API sends the newest first.
    $("log").innerHTML = (data.events || []).map(e => `<li><b>${esc(when(e.created_at))}</b> · ${esc(e.text)}</li>`).join("");
    drawDock();
  }

  // ---- the board ------------------------------------------------------------
  // Tiles are blank: charted or not. Coordinates are not shown here; the board shows them on hover,
  // right-click and long-press. (The screen reader list names every tile.)
  const tileAt = (q, r) => BOARD && BOARD.tiles.find(t => t.x === q && t.y === r && t.z === 0);
  const piecesAt = t => (BOARD ? BOARD.pieces.filter(p => p.at.x === t.x && p.at.y === t.y && p.at.z === t.z) : []);
  const myPiece = () => (BOARD && ME && ME.player ? BOARD.pieces.find(p => p.color.key === ME.player.color.key) : null);
  function canMoveTo(t) {
    const me = myPiece(), R = BOARD && BOARD.rules;
    if (!me || !R || me.at.z !== t.z) return false;
    const dx = Math.abs(t.x - me.at.x), dy = Math.abs(t.y - me.at.y);
    const steps = R.diagonal_moves ? Math.max(dx, dy) : dx + dy;
    if (steps < 1 || steps > R.move_distance) return false;
    return R.shared_tiles || !piecesAt(t).length;
  }
  // What can the person looking do right now? Only move on your own turn, once.
  function myMove() {
    if (!ME || !ME.player || !DATA) return { ok: false, why: ME ? "" : "Log in to play." };
    const g = DATA.game;
    if (g.status === "setup") return { ok: false, why: "The game has not started yet." };
    if (g.status !== "playing") return { ok: false, why: "" };
    const current = DATA.players[g.turn];
    if (ME.player.turn_order !== g.turn) return { ok: false, why: current ? `Waiting for ${who(current.name, current.color)} to play.` : "" };
    if (g.moved) return { ok: false, why: "You have already moved this turn." };
    return { ok: true };
  }

  function drawPanel() {
    const box = $("tile-panel");
    if (!box) return;
    const t = SEL && tileAt(SEL.x, SEL.y);
    if (!t) { box.innerHTML = ""; return; }
    const here = piecesAt(t);
    const move = myMove();
    let html = `<h3>A charted tile</h3>
      <p>${here.length ? here.map(p => `<span class="dot" style="background:${hex(p.color)}"></span> ${esc(who(p.name, p.color))} is here`).join("<br>") : '<span class="muted">Nobody is here.</span>'}</p>`;
    if (move.ok && canMoveTo(t)) {
      html += `<div><button class="btn" id="move-btn" type="button">Move here</button></div><div id="act-msg" role="status"></div>`;
    } else if (move.ok) {
      html += `<p class="muted">Your move: pick a tile next to your piece.</p>`;
    } else if (move.why) {
      html += `<p class="muted">${esc(move.why)}</p>`;
    }
    box.innerHTML = html;
    const mv = $("move-btn");
    if (mv) mv.onclick = () => act({ kind: "move", x: t.x, y: t.y, z: t.z }, mv);
  }

  async function act(body, button) {
    const msg = $("act-msg");
    button.disabled = true; msg.className = ""; msg.textContent = "Sending…";
    const r = await api("/api/action", body);
    if (r.ok) {
      await refresh();
      const m = $("act-msg");
      if (m) m.textContent = "Moved. You may still propose a rule change this turn.";
      return;
    }
    msg.className = "notice err";
    msg.textContent = (r.data && r.data.error) || "Something went wrong.";
    button.disabled = false;
    if (r.status === 409 || r.status === 403) { const t = msg.textContent; await refresh(); const m = $("act-msg"); if (m) { m.className = "notice err"; m.textContent = t; } }
  }

  function select(q, r) {
    SEL = q == null ? null : { x: q, y: r };
    if (VIEW) VIEW.select(q, r);
    drawPanel();
  }

  function drawBoard(b) {
    BOARD = b;
    if (VIEW) VIEW.setData(b, ME && ME.player ? ME.player.color.key : null);
    $("tile-list").innerHTML = b.tiles.filter(t => t.z === 0).map(t => `<li><button type="button" data-x="${t.x}" data-y="${t.y}">${esc("Tile " + t.label + (piecesAt(t).length ? ", " + piecesAt(t).map(p => who(p.name, p.color)).join(", ") : ""))}</button></li>`).join("");
    drawPanel();
  }
  $("tile-list").addEventListener("click", e => {
    const b = e.target.closest("button[data-x]");
    if (b) select(Number(b.dataset.x), Number(b.dataset.y));
  });

  async function refresh() {
    const [g, b, me] = await Promise.all([api("/api/game"), api("/api/board"), api("/api/me")]);
    if (me.ok) ME = me.data;
    if (g.ok) drawGame(g.data);
    if (b.ok) drawBoard(b.data);
  }

  async function initBoard() {
    const wrap = $("board-wrap");
    try {
      const { createBoard } = await import("/js/board.js");
      VIEW = await createBoard(wrap, { onSelect: select });
      window.__board = VIEW;   // handle for the browser tests
      if (BOARD) VIEW.setData(BOARD, ME && ME.player ? ME.player.color.key : null);
      if (SEL) VIEW.select(SEL.x, SEL.y);
    } catch (e) {
      console.error(e);
      wrap.innerHTML = '<p class="muted" style="padding:12px">The board could not be drawn. The tiles are listed below.</p>';
    }
  }
  const boardLoaded = api("/api/board").then(b => { if (b.ok) drawBoard(b.data); });
  initBoard();
  load();
</script>
</body>
</html>
