# One Cloudflare Worker with static assets, deployed by Workers Builds from GitHub
# (production: `npx wrangler deploy`; pull requests: `npx wrangler preview`).
# There is no build step.
name = "promptocracy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Static files: only what is in public/ can ever be served, and only because
# src/index.ts asks for it (run_worker_first), so a file in public/ is NOT public
# unless the router names it. Everything else in the repo is never uploaded.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "promptocracy"
# Placeholder. `npx wrangler d1 create promptocracy` prints the real id; paste it
# here before the first deploy. Local development ignores it.
database_id = "639f045e-df2d-406e-91a4-a1facc4ca2fe"
migrations_dir = "migrations"

[vars]
# PRODUCTION values. Cloudflare Email Sending is set up for promptocracy.us, and the
# sender is Chalant (the referee), not "Promptocracy". Local development and the tests
# override both (.dev.vars.example and tests/lib.mjs set them empty, so email goes to the
# outbox table and links use the local origin). Previews do not inherit [vars] at all.
MAIL_FROM = "Chalant <chalant@promptocracy.us>"
SITE_URL = "https://promptocracy.us"

# Cloudflare Email Sending (https://developers.cloudflare.com/email-service/). When this
# binding exists AND MAIL_FROM is set it is used first; otherwise RESEND_API_KEY, then
# DEV_MODE (local only). With none of them, join and log-in return 503.
[[send_email]]
name = "EMAIL"
# No `remote = true` here: that flag only affects `wrangler dev` (it would make local
# development, and the tests, demand a Cloudflare login to reach the real service).
# A deployed Worker always uses the real service.

# ---------------------------------------------------------------------------
# PREVIEWS (pull request builds) MUST NEVER SHARE THE PRODUCTION DATABASE.
# `wrangler preview` creates a Preview of this same Worker per branch. Cloudflare's
# docs: "Previews do not inherit production settings", so a Preview gets only what
# is in this `previews` block: the preview D1 below, no EMAIL binding, no MAIL_FROM,
# no SITE_URL, no secrets. With no email sender, a preview answers 503 on join and
# log-in; it can never email a real person. (Only top-level `assets` and
# `compatibility_date` carry over.)
# https://developers.cloudflare.com/workers/previews/
# https://developers.cloudflare.com/workers/previews/resources/
[[previews.d1_databases]]
binding = "DB"
database_name = "promptocracy-preview"
# Placeholder. `npx wrangler d1 create promptocracy-preview` prints the real id.
# Keep wrangler.preview-migrations.toml pointing at the same database.
database_id = "9f652287-3859-4597-9c1b-c92b9185d9a7"
